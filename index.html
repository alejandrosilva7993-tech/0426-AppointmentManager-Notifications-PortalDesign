<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = "supplynet-theme";
          var s = localStorage.getItem(k);
          var dark =
            s === "dark"
              ? true
              : s === "light"
                ? false
                : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supplynet Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/primeicons@7.0.0/primeicons.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="frame" id="app-frame" data-node-id="1:2579">
      <script>
        try {
          if (
            window.matchMedia("(min-width: 768px)").matches &&
            localStorage.getItem("supplynet-sidebar-collapsed") === "1"
          ) {
            document.getElementById("app-frame").classList.add("frame--sidebar-collapsed");
          }
        } catch (e) {}
      </script>
      <div class="app-shell" data-node-id="12:770">
        <div class="app-shell__lazy-bg" aria-hidden="true"></div>
        <div

        <header class="topbar" data-node-id="12:772">

              <i class="pi pi-bars" aria-hidden="true"></i>
            </button>
            <div

              role="dialog"
              aria-modal="true"
              aria-labelledby="mobile-nav-title"
              hidden
            >
              <div class="mobile-nav-panel__header">

              </div>
              <nav class="mobile-nav-panel__nav" aria-label="Main navigation">
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-calendar"></i></span>
                  <span>Appointment control</span>
                </a>
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-box"></i></span>
                  <span>Orders</span>
                </a>
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-truck"></i></span>
                  <span>Assembly</span>
                </a>
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-inbox"></i></span>
                  <span>Picking</span>
                </a>
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-arrow-right-arrow-left"></i></span>
                  <span>Interfaces</span>
                </a>
                <a class="mobile-nav-panel__link" href="#">
                  <span class="mobile-nav-panel__icon" aria-hidden="true"><i class="pi pi-chart-line"></i></span>
                  <span>Statistics</span>
                </a>
              </nav>
            </div>
          </div>
          <div class="brand-title" data-node-id="15:102">
            <div class="brand-logo" data-node-id="31:1913">
              <img
                class="brand-logo__supply"
                src="logo-supply.svg"
                alt=""

                height="15"
              />
              <img
                class="brand-logo__net"
                src="logo-net.svg"
                alt="Supplynet"
                width="33"
                height="33"
              />
            </div>
            <span class="brand-divider" data-node-id="31:3717" aria-hidden="true"></span>
            <p class="brand-text" data-node-id="15:103">
              <span class="brand-text__strong">Supplynet </span>
              <span class="brand-text__muted">Portal</span>
            </p>
          </div>
          <div class="topbar__spacer" data-node-id="18:99"></div>
          <div class="topbar__actions" data-node-id="12:862">
            <div class="search-field" data-node-id="12:863" tabindex="-1">
              <img class="search-field__icon" src="icon-search.svg" alt="" width="16" height="16" />
              <span class="search-field__placeholder" data-node-id="12:865">Search...</span>
              <kbd class="search-field__kbd" data-node-id="12:866"><span data-node-id="12:867">/</span></kbd>
            </div>
          </div>
          <div class="topbar__icon-group" data-node-id="26:1820">
              <div class="topbar__notif-wrap">
                <button
                  type="button"
                  class="icon-btn"
                  id="notif-toggle"
                  aria-label="Notifications"
                  aria-expanded="false"
                  aria-haspopup="dialog"
                  aria-controls="notif-panel"
                >
                  <img src="icon-bell-topbar.svg" alt="" width="14" height="14" />
                  <span
                    class="topbar__notif-badge"
                    id="notif-badge"
                    hidden
                    aria-hidden="true"
                  ></span>
                </button>
                <div
                  class="notif-panel"
                  id="notif-panel"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="notif-panel-title"
                  hidden
                >
                  <div class="notif-panel__header">
                    <h2 class="notif-panel__heading" id="notif-panel-title">Notifications</h2>
                    <div
                      class="notif-panel__tabs"
                      role="tablist"
                      aria-label="Filter notifications"
                    >
                      <button
                        type="button"
                        class="notif-panel__tab notif-panel__tab--active"
                        id="notif-tab-all"
                        role="tab"
                        aria-selected="true"
                        aria-controls="notif-tabpanel"
                      >
                        All
                      </button>
                      <button
                        type="button"
                        class="notif-panel__tab"
                        id="notif-tab-unread"
                        role="tab"
                        aria-selected="false"
                        aria-controls="notif-tabpanel"
                      >
                        Unread
                        <span
                          class="notif-panel__tab-badge"
                          id="notif-unread-tab-count"
                          hidden

                        >0</span>
                      </button>
                    </div>
                  </div>
                  <div class="notif-panel__stack">
                  <ul
                    class="notif-panel__list"
                    id="notif-tabpanel"
                    role="tabpanel"
                    aria-labelledby="notif-tab-all"
                  >
                    <li
                      class="notif-panel__row notif-panel__row--unread"
                      data-unread="true"
                      data-notif-key="appointment"
                    >
                      <button
                        type="button"
                        class="notif-panel__item"
                        aria-label="Open: New appointment request from María Elena Ríos. View detail and mark as read."
                      >
                        <span class="notif-panel__item-icon" aria-hidden="true">
                          <i class="pi pi-calendar-plus"></i>
                        </span>
                        <span class="notif-panel__item-text">
                          <strong>New appointment request</strong> — María Elena Ríos
                        </span>
                        <span class="notif-panel__item-time">5m ago</span>
                        <span class="notif-panel__item-chevron" aria-hidden="true">
                          <i class="pi pi-angle-right"></i>
                        </span>
                      </button>
                    </li>
                    <li
                      class="notif-panel__row notif-panel__row--unread"
                      data-unread="true"
                      data-notif-key="shipment-tms"
                    >
                      <button
                        type="button"
                        class="notif-panel__item"
                        aria-label="Open: Shipment TMS-1082 requires your approval. View detail and mark as read."
                      >
                        <span class="notif-panel__item-icon" aria-hidden="true">
                          <i class="pi pi-exclamation-triangle"></i>
                        </span>
                        <span class="notif-panel__item-text">
                          <strong>TMS-1082</strong> requires your approval before dispatch
                        </span>
                        <span class="notif-panel__item-time">1h ago</span>
                        <span class="notif-panel__item-chevron" aria-hidden="true">
                          <i class="pi pi-angle-right"></i>
                        </span>
                      </button>
                    </li>
                    <li
                      class="notif-panel__row notif-panel__row--unread"
                      data-unread="true"
                      data-notif-key="comment-load"
                    >
                      <button
                        type="button"
                        class="notif-panel__item"
                        aria-label="Open: Comment from John Smith. View detail and mark as read."
                      >
                        <span class="notif-panel__item-icon" aria-hidden="true">
                          <i class="pi pi-comment"></i>
                        </span>
                        <span class="notif-panel__item-text">
                          <strong>John Smith</strong> commented on load #4401
                        </span>
                        <span class="notif-panel__item-time">Yesterday</span>
                        <span class="notif-panel__item-chevron" aria-hidden="true">
                          <i class="pi pi-angle-right"></i>
                        </span>
                      </button>
                    </li>
                  </ul>
                  <div
                    class="notif-panel__detail"
                    id="notif-detail"
                    role="region"
                    aria-labelledby="notif-detail-title"
                    hidden
                  >
                    <div class="notif-panel__detail-body">
                      <h3 class="notif-panel__detail-title" id="notif-detail-title"></h3>
                      <p class="notif-panel__detail-meta" id="notif-detail-meta"></p>
                      <div class="notif-panel__detail-text" id="notif-detail-text"></div>
                      <div class="notif-panel__detail-footer">
                        <button
                          type="button"
                          class="notif-panel__detail-back"
                          id="notif-detail-back"
                        >
                          <span class="notif-panel__detail-back-icon" aria-hidden="true">
                            <i class="pi pi-angle-left"></i>
                          </span>
                          <span>Back</span>
                        </button>
                        <div class="notif-panel__detail-actions" id="notif-detail-actions" hidden>
                          <button
                            type="button"
                            class="notif-panel__detail-cta"
                            id="notif-detail-cta"
                            title="Prototype: in the app this would open the related screen"
                          >
                            <span class="notif-panel__detail-cta-icon" aria-hidden="true">
                              <i class="pi pi-arrow-right"></i>
                            </span>
                            <span id="notif-detail-cta-label"></span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  </div>
                  <div class="notif-panel__footer">
                    <button
                      type="button"
                      class="notif-panel__footer-btn"
                      id="notif-action-dismiss-all"
                    >
                      Dismiss all
                    </button>
                  </div>
                </div>
              </div>
              <button
                type="button"
                class="icon-btn"
                id="theme-toggle"

                title="Switch to dark mode"
                aria-pressed="false"

              </button>
              <button type="button" class="icon-btn" aria-label="User profile">

              </button>
            </div>
            <nav class="sidebar__nav" data-node-id="18:100">
              <a class="nav-item" href="#">
                <span class="nav-item__icon-wrap"><i class="pi pi-calendar" aria-hidden="true"></i></span>
                <span class="nav-item__label">Appointment control</span>
              </a>
              <a class="nav-item" href="#">
                <span class="nav-item__icon-wrap"><i class="pi pi-box" aria-hidden="true"></i></span>
                <span class="nav-item__label">Orders</span>
              </a>
              <a class="nav-item" href="#">
                <span class="nav-item__icon-wrap"><i class="pi pi-truck" aria-hidden="true"></i></span>
                <span class="nav-item__label">Assembly</span>
              </a>
              <a class="nav-item" href="#">
                <span class="nav-item__icon-wrap"><i class="pi pi-inbox" aria-hidden="true"></i></span>

              <a class="nav-item" href="#">

              <a class="nav-item" href="#">
                <span class="nav-item__icon-wrap"><i class="pi pi-chart-line" aria-hidden="true"></i></span>
                <span class="nav-item__label">Statistics</span>
              </a>
            </nav>
          </aside>

          <div class="content-column">
            <main class="main-content" data-node-id="12:870">
                           <h1 class="welcome welcome--pending" data-node-id="61:71" aria-busy="true">
                <span class="welcome__prefix" data-node-id="61:72">Welcome to </span>
                <span class="welcome__gradient" data-node-id="61:73">Supplynet Portal</span>
              </h1>
            </main>
          </div>
        </div>
      </div>
    </div>

    <div class="prototype-fabs" aria-live="polite">
      <button type="button" class="fab fab--chatbot" data-node-id="31:3720" aria-label="Assistant">
        <img
          class="fab__icon"
          src="icon-comments.svg"
          alt=""
          width="18"
          height="18"
        />
      </button>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
