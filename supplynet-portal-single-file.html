<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = "supplynet-theme";
          var s = localStorage.getItem(k);
          var dark =
            s === "dark"
              ? true
              : s === "light"
                ? false
                : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      rel="stylesheet"

    <style>
/* === main.css === */
/* Supplynet Portal — prototipo responsive (Figma Layout_Supply_1 + interacciones) */

:root {
  --sidebar-width: 220px;
  --sidebar-collapsed-width: 64px;
  --sidebar-pi-toggle-size: 11.664px; /* otro 10% menor */
  --sidebar-pi-nav-size: 16.2px; /* otro 10% menor */
  --sidebar-nav-icon-size: var(--sidebar-pi-nav-size);
  --topbar-height: 56px;
  --color-bg-frame: #eaf4fa;
  --color-sidebar: #00263a;
  --color-border: #ced4da;
  --color-topbar-border: #e5e5e5;
  --color-text: #00263a;
  --color-muted: #495057;
  --color-accent: #3b82f6;
  /* FAB chat: fijo en claro/oscuro (no seguir --color-accent del tema) */
  --fab-chat-bg: #3b82f6;
  --color-icon-muted: #6c757d;
  --brand-logo-scale: 1.21;
  --brand-text-scale: 1.1;
  --transition-sidebar: 220ms ease;
  --shell-lazy-fade: 0.745s;
  --shell-lazy-fade-reduced: 0.259s;
  --welcome-title-opacity-dur: 0.72s;
  --welcome-title-transform-dur: 0.756s;
  --welcome-title-opacity-dur-reduced: 0.324s;
  /* Panel notificaciones: tokens alineados con acento/borde del shell (sustituibles por tema Prime) */
  --notif-primary: var(--color-accent);
  --notif-surface-border: var(--color-topbar-border);
  --notif-unread-bg: rgba(59, 130, 246, 0.06);
  --notif-unread-bg-hover: rgba(59, 130, 246, 0.09);
  /* Contador no leídos (campana + badge en pestaña Unread) */
  --notif-count-badge-bg: #dc2626;
  --shadow-fab-chat:
    0 2px 1px rgba(0, 0, 0, 0.2),
    0 1px 1px rgba(0, 0, 0, 0.14),
    0 1px 8px rgba(0, 0, 0, 0.12);
  /* Superficies y estados (contrato tipo PrimeNG: overrides en html.dark) */
  --color-body-bg: #c5d5de;
  --color-surface-0: #ffffff;
  --color-shell-solid: #b5d8e5;
  --shell-gradient-start: #b5d8e5;
  --shell-gradient-mid: #d9eaf1;
  --shell-gradient-end: #eaf4fa;
  --color-search-focus-border: #94a3b8;
  --color-focus-ring: rgba(59, 130, 246, 0.2);
  --shadow-overlay: 0 4px 16px rgba(0, 38, 58, 0.12);
  --surface-hover: rgba(0, 38, 58, 0.06);
  --surface-hover-muted: rgba(0, 38, 58, 0.04);
  --color-ring-on-surface: #ffffff;
  --color-on-primary: #ffffff;
  --welcome-gradient: linear-gradient(90deg, #01283c 0%, #136e9e 100%);
  --fab-focus-ring: #1d4ed8;
}

html.dark {
  color-scheme: dark;
  /* Marco / fondo un poco más profundo */
  --color-body-bg: #0a0e18;
  --color-bg-frame: #161f2e;
  --color-sidebar: #071824;
  --color-border: #475569;
  --color-topbar-border: #334155;
  --color-text: #f1f5f9;
  --color-muted: #94a3b8;
  --color-icon-muted: #cbd5e1;
  --color-accent: #38bdf8;
  --color-surface-0: #1e293b;
  --color-shell-solid: #161f2e;
  --shell-gradient-start: #141c2a;
  /* Degradado amanecer: tonos alineados al marco un poco más bajos */
  --shell-gradient-mid: #1b2738;
  --shell-gradient-end: #223041;
  /* Amanecer: fade algo más largo; reduced-motion sigue en --shell-lazy-fade-reduced */
  --shell-lazy-fade: 1.05s;
  --shell-lazy-fade-reduced: 0.35s;
  --color-search-focus-border: #64748b;
  --color-focus-ring: rgba(56, 189, 248, 0.28);
  --shadow-overlay: 0 8px 28px rgba(0, 0, 0, 0.45);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --surface-hover-muted: rgba(255, 255, 255, 0.05);
  --color-ring-on-surface: #1e293b;
  --notif-unread-bg: rgba(56, 189, 248, 0.14);
  --notif-unread-bg-hover: rgba(56, 189, 248, 0.22);
  /* Azul ~30 % más vivo que #b5c4ce / #7d8f9a (mezcla 60/40 hacia #c2e6f3 / #7ebdd4) */
  --welcome-gradient: linear-gradient(90deg, #f2f8fb 0%, #bad1dc 45%, #7ea1b1 100%);
  --fab-focus-ring: #7dd3fc;
  /* Mismo azul del FAB que en tema claro */
  --fab-chat-bg: #3b82f6;
}

html.dark .topbar__icon-group .icon-btn img {
  filter: brightness(0) invert(1);
  opacity: 0.92;
}

html.dark .search-field__icon {
  filter: brightness(0) invert(1);
  opacity: 0.42;
}

html.dark .brand-logo img {
  filter: brightness(0) invert(1);
  opacity: 0.96;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  overflow-x: hidden;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--color-body-bg);
}

body {
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body.drawer-open {
  overflow: hidden;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Marco fluido */
.frame {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--color-bg-frame);
  overflow-x: hidden;
}

.frame--sidebar-static .sidebar,
.frame--sidebar-static .icon-btn.icon-btn--sidebar,
.frame--sidebar-static .icon-btn--sidebar__chevron,
.frame--sidebar-static .nav-item__label {
  transition: none !important;
}

.app-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  background: var(--color-shell-solid);
}

.app-shell__lazy-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    var(--shell-gradient-start) 12.661%,
    var(--shell-gradient-mid) 60.884%,
    var(--shell-gradient-end) 105.85%
  );
  opacity: 0;
  transition: opacity var(--shell-lazy-fade) ease-out;
}

/* Modo oscuro: curva más suave para el “amanecer” del degradado */
html.dark .app-shell__lazy-bg {
  transition: opacity var(--shell-lazy-fade) cubic-bezier(0.22, 0.65, 0.28, 1);
}

.app-shell.app-shell--welcome-loaded .app-shell__lazy-bg {
  opacity: 1;
}

/* Topbar por encima de .app-main: mismo z-index hace que main capture clics sobre el
   panel absoluto de notificaciones (no se “despliega” la interacción). */
.app-shell > .topbar {
  position: relative;
  z-index: 210;
}

.app-shell > .app-main {
  position: relative;
  z-index: 1;
}

/* Fila bajo la topbar: sidebar + contenido (alineado a Figma) */
.app-main {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
}

/* Backdrop móvil (desktop: pantalla completa; móvil: solo bajo la topbar) */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 199;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity var(--transition-sidebar);
  cursor: pointer;
}

.sidebar-backdrop:not([hidden]) {
  display: block;
}

.sidebar-backdrop--visible {
  opacity: 1;
}

/* Sidebar */
.sidebar {
  flex: 0 0 var(--sidebar-width);
  width: var(--sidebar-width);
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 10px 16px 12px;
  background: var(--color-sidebar);
  min-height: 0;
  flex-shrink: 0;
  transition:
    width var(--transition-sidebar),
    flex-basis var(--transition-sidebar),
    padding var(--transition-sidebar),
    transform var(--transition-sidebar);
  z-index: 200;
  overflow: hidden;
}

.sidebar__collapse-row {
  position: relative;
  height: 42px;
  width: 100%;
  flex-shrink: 0;
}

/* Mayor especificidad que .icon-btn { color: muted } para glifo PrimeIcons blanco */
.icon-btn.icon-btn--sidebar {
  position: absolute;
  top: 0;
  right: 0;
  left: auto;
  color: #fff;
  transition: transform var(--transition-sidebar);
}

.icon-btn.icon-btn--sidebar:hover {
  background-color: rgba(255, 255, 255, 0.08);
}

.icon-btn--sidebar__chevron {
  font-size: var(--sidebar-pi-toggle-size);
  line-height: 1;
  color: #fff;
  transition: transform var(--transition-sidebar);
}

.icon-btn--sidebar__chevron::before {
  color: #fff;
}

.sidebar__nav {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 0;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  padding: 10px 8px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 400;
  line-height: normal;
  color: #fff;
  white-space: nowrap;
  transition: background-color 0.15s ease;
}

.nav-item:hover {
  background-color: rgba(255, 255, 255, 0.08);
}

.nav-item:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

.nav-item__icon-wrap {
  flex-shrink: 0;
  width: var(--sidebar-nav-icon-size);
  height: var(--sidebar-nav-icon-size);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-item__icon-wrap .pi {
  font-size: var(--sidebar-pi-nav-size);
  line-height: 1;
  color: inherit;
}

.nav-item__label {
  overflow: hidden;
  text-overflow: ellipsis;
  transition:
    opacity var(--transition-sidebar),
    max-width var(--transition-sidebar);
  max-width: 200px;
  opacity: 1;
}

@media (min-width: 640px) {
  .frame--sidebar-collapsed .sidebar__nav {
    align-self: stretch;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    width: 100%;
  }

  /* Misma huella circular que .icon-btn del toggle: el hover no debe ser píldora */
  .frame--sidebar-collapsed .nav-item {
    position: relative;
    justify-content: center;
    align-items: center;
    width: 42px;
    height: 42px;
    min-width: 42px;
    max-width: 42px;
    padding: 0;
    gap: 0;
    border-radius: 28px;
    box-sizing: border-box;
  }

  /* La etiqueta no debe participar en el flex para centrar solo el icono */
  .frame--sidebar-collapsed .nav-item__label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    border: 0;
    white-space: nowrap;
    max-width: none;
    opacity: 0;
    pointer-events: none;
  }

  .frame--sidebar-collapsed .sidebar {
    flex-basis: var(--sidebar-collapsed-width);
    width: var(--sidebar-collapsed-width);
    padding: 10px 8px 16px 8px;
    align-items: center;
  }

  .frame--sidebar-collapsed .sidebar__collapse-row {
    align-self: stretch;
    width: 100%;
  }

  .frame--sidebar-collapsed .icon-btn--sidebar {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
  }

  .frame--sidebar-collapsed .icon-btn--sidebar__chevron {
    transform: scaleX(-1);
  }
}

.content-column {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

/* Topbar */
.topbar {
  position: relative;
  z-index: 210;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 16px;
  width: 100%;
  min-height: var(--topbar-height);
  padding: 10px 16px;
  background: var(--color-surface-0);
  border-bottom: 1px solid var(--color-topbar-border);
  flex-shrink: 0;
}

/*
 * Hamburguesa solo en vista muy estrecha (max-width: 639px). Debe ganar a .icon-btn { display: flex }.
 */
.icon-btn.topbar__menu-btn {
  display: none;
}

.topbar__menu-btn .pi {
  font-size: 1.125rem;
}

.topbar__menu-wrap {
  display: none;
  position: relative;
  justify-self: start;
}

.mobile-nav-panel {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 221;
  width: min(288px, calc(100vw - 24px));
  padding: 0;
  background: var(--color-surface-0);
  border: 1px solid var(--notif-surface-border);
  border-radius: 6px;
  box-shadow: var(--shadow-overlay);
  overflow: hidden;
}

.mobile-nav-panel__header {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--notif-surface-border);
}

.mobile-nav-panel__title {
  margin: 0;
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--color-text);
}

.mobile-nav-panel__nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px;
  max-height: min(360px, 55dvh);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.mobile-nav-panel__link {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.35;
  color: var(--color-text);
  text-decoration: none;
  border-radius: 8px;
  transition: background-color 0.12s ease;
}

.mobile-nav-panel__link:hover {
  background: var(--surface-hover);
}

.mobile-nav-panel__link:focus-visible {
  outline: 2px solid var(--notif-primary);
  outline-offset: 0;
}

.mobile-nav-panel__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  font-size: 14px;
  color: var(--color-icon-muted);
}

.mobile-nav-panel__icon .pi {
  line-height: 1;
}

.brand-title {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
}

.brand-logo {
  position: relative;
  width: calc(62px * var(--brand-logo-scale));
  height: calc(27px * var(--brand-logo-scale));
  flex-shrink: 0;
}

.brand-logo__supply {
  position: absolute;
  left: 0;
  top: calc(7.39px * var(--brand-logo-scale));
  width: calc(34.596px * var(--brand-logo-scale));
  height: calc(11.92px * var(--brand-logo-scale));
}

.brand-logo__net {
  position: absolute;
  left: calc(35.32px * var(--brand-logo-scale));
  top: 0;
  width: calc(26.679px * var(--brand-logo-scale));
  height: calc(26.882px * var(--brand-logo-scale));
}

.brand-divider {
  width: 1px;
  height: 28px;
  background: var(--color-border);
  flex-shrink: 0;
}

.brand-text {
  margin: 0;
  font-size: 0;
  white-space: nowrap;
}

.brand-text__strong {
  font-size: calc(14px * var(--brand-text-scale));
  font-weight: 700;
  color: var(--color-text);
}

.brand-text__muted {
  font-size: calc(14px * var(--brand-text-scale));
  font-weight: 400;
  color: var(--color-muted);
}

.topbar__spacer {
  flex: 1 1 auto;
  min-width: 8px;
  height: 1px;
}

.topbar__actions {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  flex: 1 1 auto;
  justify-content: flex-end;
  flex-wrap: wrap;
  min-width: 0;
}

.search-field {
  position: relative;
  width: 100%;
  max-width: 220px;
  min-width: 140px;
  height: 36px;
  background: var(--color-surface-0);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  flex-shrink: 1;
  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.search-field:focus-within {
  border-color: var(--color-search-focus-border);
  box-shadow: 0 0 0 2px var(--color-focus-ring);
}

.search-field__icon {
  position: absolute;
  left: 9px;
  top: 9px;
  width: 16px;
  height: 16px;
}

.search-field__placeholder {
  position: absolute;
  left: 33px;
  top: 8.5px;
  font-size: 14px;
  font-weight: 400;
  color: var(--color-muted);
  line-height: normal;
  pointer-events: none;
}

.search-field__kbd {
  position: absolute;
  right: 9px;
  top: 8.5px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 20px;
  height: auto;
  padding: 2px 6px;
  background: var(--color-surface-0);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--color-muted);
  line-height: normal;
}

.topbar__icon-group {
  display: flex;
  flex-direction: row;
  align-items: center;
  flex-shrink: 0;
}

@media (min-width: 640px) {
  .topbar {
    flex-wrap: nowrap;
  }
}

.topbar__notif-wrap {
  position: relative;
  flex-shrink: 0;
}

.topbar__notif-wrap .icon-btn {
  position: relative;
}

.topbar__notif-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--notif-count-badge-bg);
  box-shadow: 0 0 0 2px var(--color-ring-on-surface);
  color: var(--color-on-primary);
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}

/* display:inline-flex anula el [hidden] nativo del UA; forzar oculto hasta showBadge() */
.topbar__notif-badge[hidden] {
  display: none !important;
}

.topbar__notif-badge:not([hidden]) {
  display: inline-flex;
}

/* Sin notificación pendiente: la campana no se mueve ni en hover */
#notif-toggle:not(.notif-toggle--pulse) img,
#notif-toggle:hover:not(.notif-toggle--pulse) img,
#notif-toggle:focus:not(.notif-toggle--pulse) img {
  transform: none;
  animation: none;
}

/* Tintineo: una sola vez al añadir .notif-toggle--pulse (ver JS animationend) */
.notif-toggle--pulse img {
  transform-origin: 50% 12%;
  animation: notif-bell-ring 0.95s ease-in-out 1 forwards;
}

@keyframes notif-bell-ring {
  0% {
    transform: rotate(0deg);
  }
  15% {
    transform: rotate(11deg);
  }
  30% {
    transform: rotate(-10deg);
  }
  45% {
    transform: rotate(7deg);
  }
  60% {
    transform: rotate(-4deg);
  }
  75% {
    transform: rotate(2deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  #notif-toggle img {
    animation: none !important;
  }
}

.notif-panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  z-index: 220;
  /* Ancho respecto al icono: no usar casi 100vw o el borde izquierdo sale del viewport */
  width: min(400px, calc(100vw - 32px));
  max-width: calc(100vw - 16px);
  padding: 0;
  background: var(--color-surface-0);
  border: 1px solid var(--notif-surface-border);
  border-radius: 6px; /* ~Lara overlay; antes 12px en Supplynet */
  box-shadow: var(--shadow-overlay);
  overflow: hidden;
}

/* Vista estrecha: panel anclado al viewport para que quepa entero (título + lista) */
@media (max-width: 767px) {
  .notif-panel {
    position: fixed;
    top: var(--notif-panel-top, calc(env(safe-area-inset-top, 0px) + 96px));
    right: max(12px, env(safe-area-inset-right, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    width: auto;
    max-width: none;
    max-height: calc(
      100dvh - var(--notif-panel-top, 96px) - 12px - env(safe-area-inset-bottom, 0px)
    );
    display: flex;
    flex-direction: column;
  }

  .notif-panel__stack {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

    flex-direction: row;
  }

@media (max-width: 639px) {
  .topbar__menu-wrap {
    display: block;
    grid-area: topbar-menu;
  }

  .icon-btn.topbar__menu-btn {
    display: inline-flex;
    flex-shrink: 0;
  }

  .sidebar__collapse-row {
    display: none;
  }

  .sidebar-backdrop {
    top: var(--topbar-height);
    right: 0;
    bottom: 0;
    left: 0;
  }

  .topbar__spacer {
    display: none;
  }

  /*
   * Fila 1: menú | marca | iconos (siempre a la derecha)
   * Fila 2: búsqueda a ancho completo (nunca arriba con iconos abajo)
   */
  .topbar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    grid-template-areas:
      "topbar-menu topbar-brand topbar-icons"
      "topbar-search topbar-search topbar-search";
    gap: 10px 12px;
    align-items: center;

  .brand-title {
    grid-area: topbar-brand;
    flex: unset;
    min-width: 0;
  }

  .topbar__icon-group {
    grid-area: topbar-icons;
    justify-self: end;
    align-self: center;
    flex-shrink: 0;
  }

  .topbar__actions {
    grid-area: topbar-search;
    flex: unset;
    min-width: 0;
    width: 100%;
    justify-content: stretch;
    flex-wrap: nowrap;
    gap: 10px;
  }

  .search-field {
    width: 100%;
    max-width: none;
    flex: unset;
    min-width: 0;
  }

  /* Navegación vía panel; el aside no ocupa espacio en el layout */
  .sidebar {
    display: none !important;
  }
}

(function () {
  "use strict";

  /* Tema claro/oscuro: clase html.dark (mismo contrato que PrimeNG darkModeSelector: '.dark'). */
  var THEME_STORAGE_KEY = "supplynet-theme";
  var themeRoot = document.documentElement;
  var themeToggle = document.getElementById("theme-toggle");

  function themeIsDark() {
    return themeRoot.classList.contains("dark");
  }

  function themeApply(dark) {
    themeRoot.classList.toggle("dark", !!dark);
    try {
      localStorage.setItem(THEME_STORAGE_KEY, dark ? "dark" : "light");
    } catch (e) {}
    themeSyncToggle();
  }

  function themeSyncToggle() {
    if (!themeToggle) return;
    var dark = themeIsDark();
    themeToggle.setAttribute("aria-pressed", dark ? "true" : "false");
    themeToggle.setAttribute(
      "aria-label",
      dark ? "Switch to light mode" : "Switch to dark mode"
    );
    themeToggle.setAttribute(
      "title",
      dark ? "Switch to light mode" : "Switch to dark mode"
    );
  }

  if (themeToggle) {
    themeToggle.addEventListener("click", function () {
      themeApply(!themeIsDark());
    });
  }
  themeSyncToggle();
})();

(function () {
  "use strict";

  var STORAGE_KEY = "supplynet-sidebar-collapsed";
  /* Drawer + hamburguesa solo bajo este ancho (sidebar en flujo desde 640px) */
  var DRAWER_MQ = window.matchMedia("(max-width: 639px)");

  var frame = document.getElementById("app-frame");
  var sidebar = document.getElementById("sidebar");
  var backdrop = document.getElementById("sidebar-backdrop");
  var toggle = document.getElementById("sidebar-toggle");
  var toggleMobile = document.getElementById("sidebar-toggle-mobile");
  var menuWrap = document.querySelector(".topbar__menu-wrap");
  var menuPanel = document.getElementById("mobile-nav-panel");

  if (!frame || !sidebar || !toggle) return;

  frame.classList.add("frame--sidebar-static");

  function endSidebarStatic() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        frame.classList.remove("frame--sidebar-static");
      });
    });
  }

  function isDrawerMode() {
    return DRAWER_MQ.matches;
  }

  function getLabels() {
    return sidebar.querySelectorAll(".nav-item__label");
  }

  function setLabelVisibility(collapsed) {
    getLabels().forEach(function (el) {
      if (collapsed && !isDrawerMode()) {
        el.setAttribute("aria-hidden", "true");
      } else {
        el.removeAttribute("aria-hidden");
      }
    });
  }

  function applyDesktopCollapsed(collapsed) {
    if (collapsed) {
      frame.classList.add("frame--sidebar-collapsed");
    } else {
      frame.classList.remove("frame--sidebar-collapsed");
    }
    toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    toggle.setAttribute(
      "aria-label",
      collapsed ? "Expand sidebar" : "Collapse sidebar"
    );
    setLabelVisibility(collapsed);
    try {
      localStorage.setItem(STORAGE_KEY, collapsed ? "1" : "0");
    } catch (e) {}
  }

  function syncMobileMenuAria(expanded) {
    if (toggleMobile) {
      toggleMobile.setAttribute("aria-expanded", expanded ? "true" : "false");
      toggleMobile.setAttribute(
        "aria-label",
        expanded ? "Close navigation menu" : "Open navigation menu"
      );
    }
  }

  function isMenuPanelOpen() {
    return menuPanel && !menuPanel.hidden;
  }

  function openMobileNavPanel() {
    if (!menuPanel) return;
    if (typeof window.__supplynetCloseNotificationPanel === "function") {
      window.__supplynetCloseNotificationPanel();
    }
    menuPanel.hidden = false;
    backdrop.hidden = false;
    backdrop.setAttribute("aria-hidden", "false");
    requestAnimationFrame(function () {
      backdrop.classList.add("sidebar-backdrop--visible");
    });
    syncMobileMenuAria(true);
    document.body.classList.add("drawer-open");
  }

  function closeMobileNavPanel() {
    if (!menuPanel) return;
    menuPanel.hidden = true;
    backdrop.classList.remove("sidebar-backdrop--visible");
    document.body.classList.remove("drawer-open");
    syncMobileMenuAria(false);
    window.setTimeout(function () {
      if (!isMenuPanelOpen()) {
        backdrop.hidden = true;
        backdrop.setAttribute("aria-hidden", "true");
      }
    }, 220);
  }

  function syncFromStorage() {
    if (isDrawerMode()) return;
    try {
      if (localStorage.getItem(STORAGE_KEY) === "1") {
        applyDesktopCollapsed(true);
      }
    } catch (e) {}
  }

  function onResize() {
    if (!isDrawerMode()) {
      closeMobileNavPanel();
      backdrop.hidden = true;
      backdrop.classList.remove("sidebar-backdrop--visible");
      backdrop.setAttribute("aria-hidden", "true");
      document.body.classList.remove("drawer-open");
      syncFromStorage();
      setLabelVisibility(frame.classList.contains("frame--sidebar-collapsed"));
    } else {
      frame.classList.remove("frame--sidebar-collapsed");
      closeMobileNavPanel();
      setLabelVisibility(false);
      syncMobileMenuAria(false);
    }
  }

  function onSidebarToggleClick() {
    if (isDrawerMode()) {
      if (isMenuPanelOpen()) {
        closeMobileNavPanel();
      } else {
        openMobileNavPanel();
      }
    } else {
      var next = !frame.classList.contains("frame--sidebar-collapsed");
      applyDesktopCollapsed(next);
    }
  }

  toggle.addEventListener("click", onSidebarToggleClick);
  if (toggleMobile) {
    toggleMobile.addEventListener("click", function (e) {
      e.stopPropagation();
      onSidebarToggleClick();
    });
  }

  if (menuWrap) {
    menuWrap.addEventListener("click", function (e) {
      e.stopPropagation();
    });
  }

  backdrop.addEventListener("click", function () {
    if (isDrawerMode()) closeMobileNavPanel();
  });

  document.addEventListener("click", function (e) {
    if (!isDrawerMode() || !menuPanel || menuPanel.hidden) return;
    if (menuWrap && !menuWrap.contains(e.target)) {
      closeMobileNavPanel();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && isDrawerMode() && isMenuPanelOpen()) {
      closeMobileNavPanel();
      if (toggleMobile) toggleMobile.focus();
      else toggle.focus();
    }
  });

  if (menuPanel) {
    menuPanel.addEventListener("click", function (e) {
      if (e.target.closest(".mobile-nav-panel__link")) {
        closeMobileNavPanel();
      }
    });
  }

  DRAWER_MQ.addEventListener("change", onResize);
  window.addEventListener("resize", onResize);

  if (isDrawerMode()) {
    syncMobileMenuAria(false);
    getLabels().forEach(function (el) {
      el.removeAttribute("aria-hidden");
    });
  } else {
    syncFromStorage();
    setLabelVisibility(frame.classList.contains("frame--sidebar-collapsed"));
  }

  window.__supplynetCloseMobileNavPanel = closeMobileNavPanel;

  endSidebarStatic();
})();

(function () {
  "use strict";

  var NOTIF_AFTER_WELCOME_MS = 1500;
  var BELL_RING_AFTER_BADGE_MS = 500;
  var wrap = document.querySelector(".topbar__notif-wrap");
  var btn = document.getElementById("notif-toggle");
  var badge = document.getElementById("notif-badge");
  var panel = document.getElementById("notif-panel");
  var list = document.getElementById("notif-tabpanel");
  var btnDismissAll = document.getElementById("notif-action-dismiss-all");
  var tabAll = document.getElementById("notif-tab-all");
  var tabUnread = document.getElementById("notif-tab-unread");
  var tabUnreadBadge = document.getElementById("notif-unread-tab-count");
  var detail = document.getElementById("notif-detail");
  var detailTitle = document.getElementById("notif-detail-title");
  var detailMeta = document.getElementById("notif-detail-meta");
  var detailText = document.getElementById("notif-detail-text");
  var btnDetailBack = document.getElementById("notif-detail-back");
  var detailActions = document.getElementById("notif-detail-actions");
  var detailCta = document.getElementById("notif-detail-cta");
  var detailCtaLabelText = document.getElementById("notif-detail-cta-label");

  if (!wrap || !btn || !badge || !panel || !list || !btnDismissAll) return;
  if (!tabAll || !tabUnread || !tabUnreadBadge) return;
  if (
    !detail ||
    !detailTitle ||
    !detailMeta ||
    !detailText ||
    !btnDetailBack ||
    !detailActions ||
    !detailCta ||
    !detailCtaLabelText
  )
    return;

  var NOTIF_DETAILS = {
    appointment: {
      title: "New appointment request",
      meta: "María Elena Ríos · Warehouse North · 5 minutes ago",
      html:
        "<p>María Elena Ríos requested a pickup slot on <strong>Thursday, April 16</strong>, 09:00–11:00.</p><p>Reference <strong>PO-8821</strong>. Confirm or propose another window in TMS.</p>",
      goLabel: "Go to calendar",
      goIcon: "pi-calendar",
      goScreen: "calendar",
    },
    "shipment-tms": {
      title: "Approval required — TMS-1082",
      meta: "Dispatch · 1 hour ago",
      html:
        "<p>Shipment <strong>TMS-1082</strong> is blocked until you approve the route and carrier assignment.</p><p>Review costs and ETA, then approve or reject in the shipment workflow.</p>",
      goLabel: "Go to shipments & approvals",
      goIcon: "pi-truck",
      goScreen: "shipments-approval",
    },
    "comment-load": {
      title: "Comment on load #4401",
      meta: "John Smith · Yesterday",
      html:
        "<p><strong>John Smith</strong> commented on load <strong>#4401</strong>:</p><p>“Please confirm the revised delivery window with the consignee before we reschedule the truck.”</p>",
      goLabel: "Go to load #4401",
      goIcon: "pi-map-marker",
      goScreen: "load-detail",
    },
  };

  var notificationPending = false;
  var unreadCount = 0;
  var bellRingCanceled = false;
  var bellRingDelayId = null;
  var filterUnreadActive = false;

  function countVisibleNotifications() {
    return list.querySelectorAll(".notif-panel__row:not([hidden])").length;
  }

  function countUnread() {
    return list.querySelectorAll(
      '.notif-panel__row:not([hidden])[data-unread="true"]'
    ).length;
  }

  function updateTabBadge() {
    var n = countUnread();
    if (n < 1) {
      tabUnreadBadge.textContent = "0";
      tabUnreadBadge.hidden = true;
      tabUnreadBadge.setAttribute("aria-hidden", "true");
    } else {
      tabUnreadBadge.textContent = badgeDisplayText(n);
      tabUnreadBadge.hidden = false;
      tabUnreadBadge.setAttribute("aria-hidden", "true");
    }
  }

  function applyFilter() {
    if (filterUnreadActive) {
      panel.classList.add("notif-panel--filter-unread");
    } else {
      panel.classList.remove("notif-panel--filter-unread");
    }
  }

  function selectFilterTab(unreadOnly) {
    closeNotifDetail();
    filterUnreadActive = unreadOnly;
    tabAll.setAttribute("aria-selected", unreadOnly ? "false" : "true");
    tabUnread.setAttribute("aria-selected", unreadOnly ? "true" : "false");
    tabAll.classList.toggle("notif-panel__tab--active", !unreadOnly);
    tabUnread.classList.toggle("notif-panel__tab--active", unreadOnly);
    list.setAttribute("aria-labelledby", unreadOnly ? "notif-tab-unread" : "notif-tab-all");
    applyFilter();
  }

  function syncNotificationState() {
    var visible = countVisibleNotifications();
    if (visible < 1) {
      clearNotification();
      return;
    }
    unreadCount = countUnread();
    if (unreadCount > 0) {
      badge.textContent = badgeDisplayText(unreadCount);
      badge.hidden = false;
      badge.setAttribute("aria-hidden", "true");
      btn.setAttribute("aria-label", notifButtonAriaLabel(unreadCount));
    } else {
      badge.textContent = "";
      badge.hidden = true;
      badge.setAttribute("aria-hidden", "true");
      btn.setAttribute("aria-label", "Notifications");
    }
    updateTabBadge();
  }

  function badgeDisplayText(n) {
    return n > 9 ? "9+" : String(n);
  }

  function notifButtonAriaLabel(n) {
    if (n === 1) return "Notifications, 1 unread";
    return "Notifications, " + n + " unread";
  }

  function showBadge() {
    var visible = countVisibleNotifications();
    if (visible < 1) return;
    notificationPending = true;
    bellRingCanceled = false;
    unreadCount = countUnread();
    syncNotificationState();

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion || unreadCount < 1) return;

    if (bellRingDelayId !== null) {
      window.clearTimeout(bellRingDelayId);
      bellRingDelayId = null;
    }
    bellRingDelayId = window.setTimeout(function () {
      bellRingDelayId = null;
      if (bellRingCanceled || !notificationPending || countUnread() < 1) return;
      var bellImg = btn.querySelector("img");
      if (!bellImg) return;
      btn.classList.add("notif-toggle--pulse");
      bellImg.addEventListener(
        "animationend",
        function onBellRingEnd(e) {
          if (e.animationName !== "notif-bell-ring") return;
          btn.classList.remove("notif-toggle--pulse");
        },
        { once: true }
      );
    }, BELL_RING_AFTER_BADGE_MS);
  }

  function closeNotifDetail() {
    detail.hidden = true;
    panel.classList.remove("notif-panel--detail");
    list.removeAttribute("aria-hidden");
  }

  function markRowRead(row) {
    if (!row || row.getAttribute("data-unread") !== "true") return;
    row.setAttribute("data-unread", "false");
    row.classList.remove("notif-panel__row--unread");
    row.classList.add("notif-panel__row--read");
    syncNotificationState();
  }

  function openNotifDetail(row) {
    var key = row && row.getAttribute("data-notif-key");
    var d = key && NOTIF_DETAILS[key];
    if (!d) return;
    detailTitle.textContent = d.title;
    detailMeta.textContent = d.meta;
    detailText.innerHTML = d.html;
    var iconEl = detailCta.querySelector(".notif-panel__detail-cta-icon i");
    if (iconEl && d.goIcon) iconEl.className = "pi " + d.goIcon;
    detailCtaLabelText.textContent = d.goLabel || "";
    detailCta.setAttribute("data-go-screen", d.goScreen || "");
    detailCta.setAttribute(
      "aria-label",
      d.goLabel ? d.goLabel + " (prototype, no navigation)" : "Open related screen"
    );
    detailActions.hidden = !d.goLabel;
    detail.hidden = false;
    panel.classList.add("notif-panel--detail");
    list.setAttribute("aria-hidden", "true");
    markRowRead(row);
  }

  function syncNotifPanelFixedTop() {
    var topbar = document.querySelector(".app-shell > .topbar");
    if (!topbar) return;
    if (window.matchMedia("(max-width: 767px)").matches && !panel.hidden) {
      var br = topbar.getBoundingClientRect();
      panel.style.setProperty(
        "--notif-panel-top",
        Math.round(br.bottom + 10) + "px"
      );
    } else {
      panel.style.removeProperty("--notif-panel-top");
    }
  }

  function openPanel() {
    if (typeof window.__supplynetCloseMobileNavPanel === "function") {
      window.__supplynetCloseMobileNavPanel();
    }
    panel.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    syncNotifPanelFixedTop();
  }

  function closePanel() {
    closeNotifDetail();
    panel.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    panel.style.removeProperty("--notif-panel-top");
  }

  function clearNotification() {
    bellRingCanceled = true;
    if (bellRingDelayId !== null) {
      window.clearTimeout(bellRingDelayId);
      bellRingDelayId = null;
    }
    notificationPending = false;
    unreadCount = 0;
    filterUnreadActive = false;
    panel.classList.remove("notif-panel--filter-unread");
    tabAll.setAttribute("aria-selected", "true");
    tabUnread.setAttribute("aria-selected", "false");
    tabAll.classList.add("notif-panel__tab--active");
    tabUnread.classList.remove("notif-panel__tab--active");
    list.setAttribute("aria-labelledby", "notif-tab-all");
    tabUnreadBadge.textContent = "0";
    tabUnreadBadge.hidden = true;
    tabUnreadBadge.setAttribute("aria-hidden", "true");
    closePanel();
    list.querySelectorAll(".notif-panel__row").forEach(function (row) {
      row.hidden = true;
    });
    badge.textContent = "";
    badge.hidden = true;
    badge.setAttribute("aria-hidden", "true");
    btn.classList.remove("notif-toggle--pulse");
    btn.setAttribute("aria-label", "Notifications");
  }

  window.addEventListener(
    "supplynet:welcome-complete",
    function () {
      window.setTimeout(showBadge, NOTIF_AFTER_WELCOME_MS);
    },
    { once: true }
  );

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!notificationPending) return;
    if (panel.hidden) {
      openPanel();
    } else {
      closePanel();
    }
  });

  window.addEventListener("resize", syncNotifPanelFixedTop);

  document.addEventListener("click", function (e) {
    if (!panel.hidden && !wrap.contains(e.target)) {
      closePanel();
    }
  });

  panel.addEventListener("click", function (e) {
    e.stopPropagation();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || panel.hidden) return;
    if (panel.classList.contains("notif-panel--detail")) {
      closeNotifDetail();
      return;
    }
    closePanel();
    btn.focus();
  });

  tabAll.addEventListener("click", function () {
    selectFilterTab(false);
  });

  tabUnread.addEventListener("click", function () {
    selectFilterTab(true);
  });

  list.addEventListener("click", function (e) {
    var item = e.target.closest(".notif-panel__item");
    if (!item) return;
    var row = item.closest(".notif-panel__row");
    if (!row || row.hidden) return;
    openNotifDetail(row);
  });

  btnDetailBack.addEventListener("click", function () {
    closeNotifDetail();
    btnDetailBack.focus();
  });

  detailCta.addEventListener("click", function () {
    var screen = detailCta.getAttribute("data-go-screen") || "";
    if (screen && typeof console !== "undefined" && console.log) {
      console.log("[Supplynet prototype] Simulated navigation:", screen);
    }
  });

  btnDismissAll.addEventListener("click", function (e) {
    e.stopPropagation();
    if (panel.classList.contains("notif-panel--detail")) return;
    clearNotification();
  });

  window.__supplynetCloseNotificationPanel = closePanel;
})();

/* Degradado del shell + título: load → fuentes → idle → pausa → fade (--shell-lazy-fade) */
(function () {
  "use strict";

  var shell = document.querySelector(".app-shell");
  var welcome = document.querySelector(".welcome");
  var lazyBg = shell && shell.querySelector(".app-shell__lazy-bg");
  if (!shell || !welcome) return;

  var pauseMs = 274;
  var idleMaxMs = 2016;
  var fadeRaw = getComputedStyle(document.documentElement)
    .getPropertyValue("--shell-lazy-fade")
    .trim();
  var gradientMs = Math.round(parseFloat(fadeRaw) * 1000) || 745;

  function notifyWelcomeComplete() {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var root = document.documentElement;
    var opMs =
      Math.round(
        parseFloat(
          getComputedStyle(root).getPropertyValue("--welcome-title-opacity-dur").trim()
        ) * 1000
      ) || 720;
    var trMs =
      Math.round(
        parseFloat(
          getComputedStyle(root).getPropertyValue("--welcome-title-transform-dur").trim()
        ) * 1000
      ) || 756;
    var opRedMs =
      Math.round(
        parseFloat(
          getComputedStyle(root)
            .getPropertyValue("--welcome-title-opacity-dur-reduced")
            .trim()
        ) * 1000
      ) || 324;
    var fallbackMs = reduce ? opRedMs + 80 : Math.max(opMs, trMs) + 100;

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      welcome.removeEventListener("transitionend", onTe);
      window.dispatchEvent(new CustomEvent("supplynet:welcome-complete"));
    }
    var gotOpacity = false;
    var gotTransform = false;
    function onTe(e) {
      if (e.target !== welcome) return;
      if (e.propertyName === "opacity") gotOpacity = true;
      if (e.propertyName === "transform") gotTransform = true;
      if (reduce && gotOpacity) finish();
      if (!reduce && gotOpacity && gotTransform) finish();
    }
    welcome.addEventListener("transitionend", onTe);
    window.setTimeout(finish, fallbackMs);
  }

  function showTitle() {
    welcome.classList.remove("welcome--pending");
    welcome.classList.add("welcome--visible");
    welcome.setAttribute("aria-busy", "false");
    notifyWelcomeComplete();
  }

  function runGradientThenTitle() {
    shell.classList.add("app-shell--welcome-loaded");
    if (!lazyBg) {
      window.setTimeout(showTitle, gradientMs);
      return;
    }
    var done = false;
    function next() {
      if (done) return;
      done = true;
      lazyBg.removeEventListener("transitionend", onEnd);
      showTitle();
    }
    function onEnd(e) {
      if (e.target === lazyBg && e.propertyName === "opacity") next();
    }
    lazyBg.addEventListener("transitionend", onEnd);
    window.setTimeout(next, gradientMs + 52);
  }

  function afterIdle() {
    window.setTimeout(runGradientThenTitle, pauseMs);
  }

  window.addEventListener(
    "load",
    function () {
      function queueIdle(fn) {
        if (window.requestIdleCallback) {
          window.requestIdleCallback(fn, { timeout: idleMaxMs });
        } else {
          window.setTimeout(fn, 288);
        }
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          queueIdle(afterIdle);
        });
      } else {
        queueIdle(afterIdle);
      }
    },
    { once: true }
  );
})();
